<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الأسئلة الشائعة - BarberFlow Pro">
    <title>الأسئلة الشائعة | BarberFlow Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="public/assets/favicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Global Styles -->
    <link rel="stylesheet" href="shared/styles/global.css">
    <link rel="stylesheet" href="shared/styles/global-navbar.css">
    <link rel="stylesheet" href="shared/styles/notifications.css">
    
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="faq.css">
</head>
<body>
    <!-- Global Navbar Container -->
    <div id="global-navbar-container"></div>
    
    <!-- Notification Container -->
    <div id="notification-container"></div>
    
    <!-- Main Content -->
    <main class="faq-page">
        <section class="hero-section">
            <div class="container">
                <h1 class="page-title">الأسئلة الشائعة</h1>
                <p class="page-subtitle">ابحث عن إجابات لأسئلتك الشائعة حول خدماتنا وطريقة الاستخدام</p>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <!-- Search Box -->
                <div class="faq-search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="faqSearch" class="faq-search-input" placeholder="ابحث عن سؤالك هنا...">
                </div>

                <!-- Categories -->
                <div class="faq-categories">
                    <button class="category-btn active" data-category="all">
                        <i class="fas fa-th-large"></i>
                        <span>الكل</span>
                    </button>
                    <button class="category-btn" data-category="general">
                        <i class="fas fa-info-circle"></i>
                        <span>عام</span>
                    </button>
                    <button class="category-btn" data-category="booking">
                        <i class="fas fa-calendar-check"></i>
                        <span>الحجز</span>
                    </button>
                    <button class="category-btn" data-category="payment">
                        <i class="fas fa-credit-card"></i>
                        <span>الدفع</span>
                    </button>
                    <button class="category-btn" data-category="technical">
                        <i class="fas fa-cog"></i>
                        <span>تقني</span>
                    </button>
                    <button class="category-btn" data-category="account">
                        <i class="fas fa-user-circle"></i>
                        <span>الحساب</span>
                    </button>
                </div>

                <!-- FAQ List -->
                <div id="faqList" class="faq-list">
                    <!-- Questions will be added dynamically -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-search"></i>
                    <h3>لم يتم العثور على أسئلة</h3>
                    <p>لم نجد أسئلة تطابق بحثك. جرب كلمات أخرى أو تواصل معنا</p>
                    <a href="#" class="btn btn-accent" data-path="CONTACT">
                        <i class="fas fa-envelope"></i>
                        <span>تواصل معنا</span>
                    </a>
                </div>

                <!-- Help Section -->
                <div class="faq-help-section">
                    <h2>هل ما زلت بحاجة للمساعدة؟</h2>
                    <p>فريقنا جاهز لمساعدتك في أي وقت</p>
                    <div class="help-actions">
                        <a href="#" class="btn btn-accent" data-path="CONTACT">
                            <i class="fas fa-paper-plane"></i>
                            <span>أرسل لنا رسالة</span>
                        </a>
                        <a href="tel:+212501234567" class="btn btn-outline">
                            <i class="fas fa-phone"></i>
                            <span>اتصل بنا</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="faq-footer">
        <div class="container">
            <p>&copy; 2026 BarberFlow Pro. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="shared/layout/global-navbar.js"></script>
    <script type="module" src="faq.js"></script>
</body>
</html>
